[package]
name = "fileuc-settings"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "fileuc_settings"
path = "src/lib.rs"

[dependencies]
fileuc-types = { path = "../fileuc-types", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.9"

[build-dependencies]
slint-build = "1.9"

[dev-dependencies]
tempfile = "3"
