[package]
name = "fileuc-settings"
version = "0.1.6"
edition = "2021"

[lib]
name = "fileuc_settings"
path = "src/lib.rs"

[dependencies]
fileuc-types = { path = "../fileuc-types", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["image-png"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
