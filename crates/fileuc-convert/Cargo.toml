[package]
name = "fileuc-convert"
version = "0.1.1"
edition = "2021"

[lib]
name = "fileuc_convert"
path = "src/lib.rs"

[dependencies]
fileuc-types = { path = "../fileuc-types" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "tiff"] }
tiny-skia = "0.11"
resvg = "0.43"
usvg = "0.43"
pdf-writer = "0.12"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_7543", "image_latest", "thread_safe"] }
lopdf = "0.34"
ironpages = "2.0"
md-5 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
flate2 = "1.0"
tar = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
calamine = "0.38"
rust_xlsxwriter = "0.102"
csv = "1.4"
serde_json = { version = "1.0", features = ["preserve_order"] }
windows = { version = "0.58", features = [
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_Foundation",
    "Foundation",
] }

[dev-dependencies]
tempfile = "3"
