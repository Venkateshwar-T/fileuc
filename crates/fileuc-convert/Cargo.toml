[package]
name = "fileuc-convert"
version = "0.1.0"
edition = "2021"

[lib]
name = "fileuc_convert"
path = "src/lib.rs"

[dependencies]
fileuc-types = { path = "../fileuc-types" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "tiff"] }
tiny-skia = "0.11"
resvg = "0.43"
usvg = "0.43"
pdf-writer = "0.12"
lopdf = "0.34"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
flate2 = "1.0"
tar = "0.4"
tempfile = "3"
windows = { version = "0.58", features = [
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
