[package]
name = "fileuc-hook"
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "fileuc_hook"
path = "src/lib.rs"

[dependencies]
fileuc-types = { path = "../fileuc-types" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops"
] }
