[package]
name = "fileuc-hud"
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "fileuc_hud"
path = "src/lib.rs"

[dependencies]
fileuc-types = { path = "../fileuc-types" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-skia = "0.11"
ab_glyph = "0.2"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_SystemServices",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry"
] }
