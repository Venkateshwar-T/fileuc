[package]
name = "fileuc-daemon"
version = "0.1.8"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "fileuc_daemon"
path = "src/lib.rs"

[[bin]]
name = "fileuc"
path = "src/main.rs"

[dependencies]
fileuc-types = { path = "../fileuc-types", features = ["serde"] }
fileuc-hook = { path = "../fileuc-hook" }
fileuc-hud = { path = "../fileuc-hud" }
fileuc-convert = { path = "../fileuc-convert" }
fileuc-settings = { path = "../fileuc-settings" }
tiny-skia = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_System_DataExchange"
] }

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winres = "0.1"
