name: Release FileUC

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE20: 'true'

jobs:
  build-release:
    name: Build & Release 1-Click Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: crates/fileuc-settings/ui/package-lock.json

      - name: Setup Rust MSVC Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Svelte Frontend
        shell: pwsh
        run: |
          cd crates/fileuc-settings/ui
          npm ci
          npm run build

      - name: Download Chromium PDFium Engine
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile "pdfium-win-x64.tgz"
          tar -xzf pdfium-win-x64.tgz bin/pdfium.dll
          Move-Item -Path "bin/pdfium.dll" -Destination "pdfium.dll" -Force
          Remove-Item -Path "pdfium-win-x64.tgz" -Force
          Remove-Item -Path "bin" -Recurse -Force

      - name: Build Release Binary (MSVC)
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin fileuc
          New-Item -ItemType Directory -Force -Path "target/release"
          Copy-Item "target/x86_64-pc-windows-msvc/release/fileuc.exe" -Destination "target/release/fileuc.exe" -Force

      - name: Setup NSIS
        uses: nsis-dev/setup-nsis@v1

      - name: Build 1-Click Fast Installer (NSIS)
        shell: pwsh
        run: |
          makensis -DROOT_DIR="$((Get-Location).Path)" installer/FileUC.nsi

      - name: Determine Release Tag
        id: get_tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "${{ github.event.inputs.tag_name }}"
            if (-not $tag) { $tag = "v0.1.0" }
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "FileUC ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/FileUC-Setup.exe
